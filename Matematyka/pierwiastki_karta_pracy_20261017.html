/* ===== WZORY: KaTeX do wyświetlania ===== */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function czysc(l){ // LaTeX z MathLive -> zrozumiały dla KaTeX
  return String(l).replace(/\\placeholder(\[[^\]]*\])?\{[^}]*\}/g,'\\square').replace(/\\mleft/g,'\\left').replace(/\\mright/g,'\\right')
    .replace(/\\differentialD/g,'d').replace(/\\exponentialE/g,'e').replace(/\\imaginaryI/g,'i');
}
function km(l){ return katex.renderToString(czysc(l),{throwOnError:false}); }
function tm(s){ return String(s).split('$').map(function(c,i){ return i%2?km(c):esc(c); }).join(''); }

function pelneLinie(k){ return (stan.obl[k]||[]).filter(function(v){ v=String(v).trim(); return v!==''&&v!=='='; }); }

  var h=''; KLAW.forEach(function(k,i){ h+='<button class="'+(k[2]||'')+'" data-i="'+i+'">'+(k[0].indexOf('$')===0?tm(k[0]):esc(k[0]))+'</button>'; });
  var s=document.getElementById('klaw-siatka'); s.innerHTML=h;
  // nie zabieraj fokusu polu wzoru
  s.addEventListener('pointerdown',function(e){ e.preventDefault(); });
  s.addEventListener('mousedown',function(e){ e.preventDefault(); });
  s.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) klawisz(KLAW[+b.dataset.i][1]); });
})();
function klawisz(a){
  var mf=aktywne; if(!mf) return;
  if(a==='@H'){ mf.blur(); aktywne=null; schowajKlaw(); return; }
  if(a==='@N'){ nowaLinia(mf.dataset.key,mf); return; }
  mf.focus();
  if(a==='@L') mf.executeCommand('moveToPreviousChar');
  else if(a==='@R') mf.executeCommand('moveToNextChar');
  else if(a==='@B') mf.executeCommand('deleteBackward');
  else mf.insert(a,{format:'latex',selectionMode:'placeholder',focus:true,scrollIntoView:true});
  zbierz(mf.dataset.key);
}
function pokazKlaw(){ document.getElementById('klaw').style.display='block'; document.body.classList.add('z-klaw');
  if(aktywne) setTimeout(function(){ aktywne.scrollIntoView({block:'center',behavior:'smooth'}); },50); }
function schowajKlaw(){ document.getElementById('klaw').style.display='none'; document.body.classList.remove('z-klaw'); }

/* ===== ARKUSZ ODPOWIEDZI ===== */
function dzis(){ var d=new Date(); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
function kmA(l){ try{ return MathJax.tex2svg(czysc(l),{display:false}).outerHTML; }catch(e){ return esc(l); } }
function tmA(s){ return String(s).split('$').map(function(c,i){ return i%2?kmA(c):esc(c); }).join(''); }
function svgNaImg(root){ // inline SVG -> <img> w wysokiej rozdzielczości (pewne w html2canvas)
  root.querySelectorAll('mjx-container svg').forEach(function(svg){
    var r=svg.getBoundingClientRect(); if(!r.width) return;
    var c=svg.cloneNode(true); c.setAttribute('xmlns','http://www.w3.org/2000/svg');
    c.setAttribute('width',r.width*3); c.setAttribute('height',r.height*3);
    var img=new Image(); img.className='mj'; img.alt='';
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c));
    img.style.width=r.width+'px'; img.style.height=r.height+'px'; img.style.verticalAlign=svg.style.verticalAlign;
    svg.closest('mjx-container').replaceWith(img);
  });
}
function rysujArkusz(){ var a=document.getElementById('arkusz'); a.innerHTML=arkuszHTML(); svgNaImg(a); }
function linieA(k){ return pelneLinie(k).map(function(l){ return '<div class="unit a-lin">'+kmA(String.fromCharCode(92)+'displaystyle '+l)+'</div>'; }).join(''); }
function arkuszHTML(){
  var km=kmA,tm=tmA;
  var h='<div class="unit a-glowa"><div class="a-tytul">Pierwiastki — karta odpowiedzi</div>'
    +'<div>Imię i nazwisko: <b>'+(stan.imie?esc(stan.imie):'...............................')+'</b> &nbsp;&nbsp; Data: '+dzis()+'</div></div>';
  Z.forEach(function(z){
    h+='<div class="zb"><div class="unit"><b>Zadanie '+z.nr+'.</b> '+tm(z.p)+'</div>';
    if(z.typ==='abcd'){
      h+='<div class="unit a-opcje">'+z.o.map(function(o,j){ return '<span class="a-op'+(stan.odp[z.nr]===j?' a-wyb':'')+'"><b>'+LIT[j]+'.</b> '+tm(o)+'</span>'; }).join('')+'</div>';
      if(stan.odp[z.nr]==null) h+='<div class="unit a-brak">brak odpowiedzi</div>';
    }
    if(z.typ==='wiersze'){
      h+='<table class="a-tab">'+z.w.map(function(w,j){ var v=stan.odp[z.nr+'-'+j];
        return '<tr class="unit"><td>'+km(w)+'</td>'+z.et.map(function(t,m){ return '<td><span class="a-kr">'+(v===m?'X':'')+'</span>'+t+'</td>'; }).join('')+'</tr>'; }).join('')+'</table>';
    }
    if(z.typ==='ab123'){
      var a=stan.odp[z.nr+'ab'],u=stan.odp[z.nr+'u'];
      h+='<div class="unit a-opcje">'+z.ab.map(function(t,j){ return '<span class="a-op'+(a===j?' a-wyb':'')+'"><b>'+LIT[j]+'.</b> '+t+'</span>'; }).join('')+'<span>ponieważ</span></div>';
      h+=z.u.map(function(t,j){ return '<div class="unit a-opcje"><span class="a-op'+(u===j?' a-wyb':'')+'"><b>'+(j+1)+'.</b> '+tm(t)+'</span></div>'; }).join('');
      if(a==null||u==null) h+='<div class="unit a-brak">'+(a==null&&u==null?'brak odpowiedzi':'odpowiedź niepełna')+'</div>';
    }
    if(z.typ==='otw'){
      z.cz.forEach(function(c){ var k=z.nr+c[0];
        h+='<div class="unit a-cz"><b>'+c[0]+')</b> '+km(c[1])+'</div>'+(pelneLinie(k).length?linieA(k):'<div class="unit a-brak" style="margin-left:40px">brak obliczeń</div>'); });
    } else if(pelneLinie(String(z.nr)).length){
      h+='<div class="unit a-oblt">Obliczenia:</div>'+linieA(String(z.nr));
    }
    h+='</div>';
  });
  return h;
}
function pokazArkusz(){
  naArkuszu=true; schowajKlaw(); aktywne=null;
  document.getElementById('ekran-zadanie').classList.remove('aktywny');

    +(p.braki.length?'<br><span style="color:#c62828">Do uzupełnienia: zad. '+p.braki.join(', ')+'</span>':' — wszystko gotowe ✓');
  document.getElementById('imie').value=stan.imie;
  document.getElementById('arkusz').innerHTML='Przygotowuję arkusz…';

  odswiezMape(); window.scrollTo(0,0);
}

function opcjePDF(){
  var d=new Date(),dd=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  return {margin:[12,10,14,10],filename:'pierwiastki_odpowiedzi_'+dd+'.pdf',image:{type:'jpeg',quality:0.96},
    html2canvas:{scale:2.5,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['css'],avoid:['.zb','.unit']}};
}
function zapiszPDF(){
  var b=document.getElementById('pdf-btn'),inf=document.getElementById('pdf-info'),o=opcjePDF();

}
